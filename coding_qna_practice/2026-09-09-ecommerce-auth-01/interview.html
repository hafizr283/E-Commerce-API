<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Commerce API – Auth &amp; JWT Interview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    header {
      max-width: 860px;
      margin: 0 auto 2rem;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #a78bfa;
      margin-bottom: .4rem;
    }

    header p.subtitle {
      color: #94a3b8;
      font-size: .9rem;
    }

    .session-meta {
      display: flex;
      gap: 1.5rem;
      margin-top: .8rem;
      font-size: .78rem;
      color: #64748b;
    }

    .badge {
      display: inline-block;
      background: #1e1b4b;
      color: #a78bfa;
      border: 1px solid #4c1d95;
      border-radius: 999px;
      padding: .15rem .7rem;
      font-size: .75rem;
      font-weight: 600;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 12px;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: 1rem 1.25rem;
      background: #12141e;
      border-bottom: 1px solid #2d3148;
    }

    .q-number {
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      background: #4c1d95;
      color: #c4b5fd;
      font-size: .85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card-header h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #e2e8f0;
    }

    .card-header .points {
      margin-left: auto;
      font-size: .78rem;
      color: #64748b;
    }

    .card-body {
      padding: 1.25rem;
    }

    .prompt {
      font-size: .9rem;
      line-height: 1.7;
      color: #cbd5e1;
      margin-bottom: 1.25rem;
      white-space: pre-wrap;
    }

    pre {
      background: #0d1117;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
      font-size: .82rem;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      color: #7dd3fc;
      margin: .75rem 0;
    }

    label.field-label {
      display: block;
      font-size: .78rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: .4rem;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 8px;
      color: #e2e8f0;
      font-family: inherit;
      font-size: .9rem;
      line-height: 1.6;
      padding: .75rem 1rem;
      resize: vertical;
      transition: border-color .2s;
    }

    textarea:focus {
      outline: none;
      border-color: #7c3aed;
    }

    .save-indicator {
      font-size: .75rem;
      color: #4ade80;
      margin-top: .4rem;
      min-height: 1.2em;
      opacity: 0;
      transition: opacity .3s;
    }

    .save-indicator.visible { opacity: 1; }

    footer {
      max-width: 860px;
      margin: 2rem auto 0;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: .65rem 1.4rem;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
    }

    button:active { transform: scale(.97); }

    .btn-primary {
      background: #7c3aed;
      color: #fff;
    }

    .btn-primary:hover { opacity: .9; }

    .btn-secondary {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #2d3148;
    }

    .btn-secondary:hover { background: #263045; }

    .btn-danger {
      background: #450a0a;
      color: #fca5a5;
      border: 1px solid #7f1d1d;
    }

    .btn-danger:hover { background: #5f1111; }

    .progress-bar-wrap {
      max-width: 860px;
      margin: 0 auto 1.5rem;
    }

    .progress-bar-wrap p {
      font-size: .78rem;
      color: #64748b;
      margin-bottom: .4rem;
    }

    .progress-bar {
      height: 4px;
      background: #1e293b;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #7c3aed;
      border-radius: 2px;
      transition: width .4s ease;
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: #1a1d27;
      border: 1px solid #4ade80;
      color: #4ade80;
      border-radius: 8px;
      padding: .6rem 1.2rem;
      font-size: .85rem;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
      transform: translateY(2rem);
      opacity: 0;
      transition: all .3s ease;
      pointer-events: none;
    }

    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>

<header>
  <h1>🧪 E-Commerce API – Auth &amp; JWT Flow</h1>
  <p class="subtitle">Spring Boot interview session · <span class="badge">output_prediction</span></p>
  <div class="session-meta">
    <span>Session: <strong>2026-09-09-ecommerce-auth-01</strong></span>
    <span>Questions: <strong>4</strong></span>
    <span>Total points: <strong>25</strong></span>
  </div>
</header>

<div class="progress-bar-wrap">
  <p id="progress-label">Progress: 0 / 4 answered</p>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
</div>

<main id="questions"></main>

<footer>
  <button class="btn-primary" onclick="exportAnswers()">⬇ Export Answers (JSON)</button>
  <button class="btn-secondary" onclick="saveAll()">💾 Save to Browser</button>
  <button class="btn-danger" onclick="clearAll()">🗑 Clear All Answers</button>
</footer>

<div class="toast" id="toast"></div>

<script>
const SESSION_ID = "2026-09-09-ecommerce-auth-01";
const STORAGE_KEY = "interview_" + SESSION_ID;

const questions = [
  {
    id: "q1",
    number: 1,
    title: "AuthService.register() – Return Values",
    points: 7,
    prompt: `Look at the AuthService.register() method below.

\`\`\`java
public AuthResponse register(RegisterRequest req) {
    if (userRepo.findByEmail(req.getEmail()).isPresent())
        throw new RuntimeException("Email already registered: " + req.getEmail());
    User user = User.builder()
            .name(req.getName())
            .email(req.getEmail())
            .password(encoder.encode(req.getPassword()))
            .role(User.Role.USER)
            .build();
    userRepo.save(user);
    String token = jwtUtil.generateToken(user.getEmail());
    return AuthResponse.builder()
            .token(token)
            .name(user.getName())
            .email(user.getEmail())
            .role(user.getRole().name())
            .build();
}
\`\`\`

A caller sends POST /api/auth/register with body {"name":"Alice","email":"alice@test.com","password":"secret"} and alice@test.com does NOT already exist in the database.

(a) What is the value of \`role\` in the returned AuthResponse?
(b) Is the plain-text password "secret" stored in the database? Explain why or why not.
(c) What is used as the JWT subject/claim?`
  },
  {
    id: "q2",
    number: 2,
    title: "JwtUtil – Expiry & Broad Exception Catch",
    points: 7,
    prompt: `Examine the JwtUtil snippet below.

\`\`\`java
public String generateToken(String email) {
    return Jwts.builder()
            .setSubject(email)
            .setIssuedAt(new Date())
            .setExpiration(new Date(System.currentTimeMillis() + expiration))
            .signWith(SignatureAlgorithm.HS256, secret)
            .compact();
}

public boolean isTokenValid(String token) {
    try {
        Jwts.parser()
                .setSigningKey(secret)
                .parseClaimsJws(token);
        return true;
    } catch (Exception e) {
        return false;
    }
}
\`\`\`

(a) If \`expiration\` is configured as 3600000 (ms), when does the token expire relative to generation time?
(b) What happens when you call isTokenValid() with an expired token? What does it return and why?
(c) What is the risk of catching the broad \`Exception\` type instead of specific JWT exceptions?`
  },
  {
    id: "q3",
    number: 3,
    title: "SecurityConfig – Duplicate Matchers & CSRF",
    points: 8,
    prompt: `Study the SecurityConfig snippet.

\`\`\`java
http
    .csrf(csrf -> csrf.disable())
    .authorizeHttpRequests(auth -> auth
        .requestMatchers("/api/auth/**").permitAll()
        .requestMatchers("/api/auth/**", "/error","/registernew").permitAll()
        .anyRequest().authenticated());
\`\`\`

(a) The route /api/auth/** appears in TWO separate requestMatchers() calls. Is this a bug or harmless duplication? Explain the effect.
(b) Is /api/products accessible without authentication? Why or why not?
(c) CSRF protection is disabled. In what scenario is this acceptable, and when would it be a security risk?`
  },
  {
    id: "q4",
    number: 4,
    title: "Gap Analysis – Missing Login & JWT Filter",
    points: 8,
    prompt: `The project has stub classes for CartService, OrderService, and ProductController (empty bodies). AuthController only has a /register endpoint — there is NO /login endpoint, and NO JWT filter is wired into SecurityConfig.

(a) What happens if a registered user tries to call a protected route like /api/products? Trace the flow using SecurityConfig, JwtUtil, and the current AuthController.
(b) What is the minimum code you would need to add to support JWT-authenticated login? (Describe which classes to modify and what each needs to do — no implementation required.)`
  }
];

function renderPrompt(text) {
  const parts = text.split(/(```[\s\S]*?```)/g);
  return parts.map(part => {
    if (part.startsWith('```')) {
      const code = part.replace(/^```\w*\n?/, '').replace(/```$/, '');
      return `<pre>${escHtml(code)}</pre>`;
    }
    return `<span class="prompt-text">${escHtml(part)}</span>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function loadSaved() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}

function saveSaved(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function buildUI() {
  const saved = loadSaved();
  const container = document.getElementById('questions');
  questions.forEach(q => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <div class="card-header">
        <div class="q-number">${q.number}</div>
        <h2>${q.title}</h2>
        <span class="points">${q.points} pts</span>
      </div>
      <div class="card-body">
        <div class="prompt">${renderPrompt(q.prompt)}</div>
        <label class="field-label" for="${q.id}-ans">Your Answer</label>
        <textarea id="${q.id}-ans" data-qid="${q.id}" placeholder="Type your answer here…">${escHtml(saved[q.id] || '')}</textarea>
        <div class="save-indicator" id="${q.id}-saved">✓ Saved</div>
      </div>`;
    container.appendChild(div);
  });

  document.querySelectorAll('textarea').forEach(ta => {
    ta.addEventListener('input', () => {
      autoSave(ta.dataset.qid, ta.value);
      updateProgress();
    });
  });

  updateProgress();
}

let saveTimers = {};

function autoSave(qid, value) {
  clearTimeout(saveTimers[qid]);
  saveTimers[qid] = setTimeout(() => {
    const data = loadSaved();
    data[qid] = value;
    saveSaved(data);
    const ind = document.getElementById(qid + '-saved');
    if (ind) { ind.classList.add('visible'); setTimeout(() => ind.classList.remove('visible'), 1800); }
  }, 600);
}

function saveAll() {
  const data = loadSaved();
  document.querySelectorAll('textarea').forEach(ta => { data[ta.dataset.qid] = ta.value; });
  saveSaved(data);
  showToast('All answers saved to browser storage.');
}

function updateProgress() {
  const answered = questions.filter(q => {
    const ta = document.getElementById(q.id + '-ans');
    return ta && ta.value.trim().length > 0;
  }).length;
  const total = questions.length;
  document.getElementById('progress-label').textContent = `Progress: ${answered} / ${total} answered`;
  document.getElementById('progress-fill').style.width = (answered / total * 100) + '%';
}

function exportAnswers() {
  const saved = loadSaved();
  const payload = {
    session_id: SESSION_ID,
    attempt: 1,
    submitted_at: new Date().toISOString(),
    answers: questions.map(q => ({
      question_id: q.id,
      answer: saved[q.id] || ""
    }))
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `answers-${SESSION_ID}-attempt1.json`;
  a.click();
  showToast('Answers exported as JSON.');
}

function clearAll() {
  if (!confirm('Clear all saved answers? This cannot be undone.')) return;
  localStorage.removeItem(STORAGE_KEY);
  document.querySelectorAll('textarea').forEach(ta => ta.value = '');
  updateProgress();
  showToast('All answers cleared.');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

buildUI();
</script>
</body>
</html>
